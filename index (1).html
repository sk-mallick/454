<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--text:#3b2300;--muted:#a1660f;--line:#ecd08f;--ink:#7a4300;--card:#fffdf5;--grad:linear-gradient(135deg,#ffc400,#ff7a00);--shadow:0 4px 0 #d85f00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#fff4c2 0%,#ffe0a3 55%,#ffc58a 100%) fixed;color:var(--text);font-family:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:520px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.7rem;margin:6px 0 18px;font-weight:700}
h1 .no{background:var(--grad);color:#fff;border-radius:12px;padding:2px 10px;font-size:1.2rem;box-shadow:var(--shadow)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.panel h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;padding:11px 0;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;border-color:#e86a00;box-shadow:0 3px 0 #d85f00}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0}
.prow+.prow{border-top:2px dashed var(--line)}
.prow .nm{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.sw{display:flex;gap:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px transparent;cursor:pointer;padding:0;display:grid;place-items:center;color:#fff}
.sw button.on{box-shadow:0 0 0 2px var(--text)}
.sw button.taken{opacity:.25}
.sw svg{width:14px;height:14px;stroke-width:3.2}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:18px;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow);letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d85f00}
.bar{display:flex;justify-content:space-between;margin-bottom:10px}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;font:inherit;color:var(--text);cursor:pointer}
.gcard .gi{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.gcard .gi svg{width:26px;height:26px;fill:currentColor;stroke:none}
.gcard b{display:block;font-size:1.1rem}.gcard small{color:var(--muted)}
.ib{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.pcards{display:flex;gap:8px;margin:8px 0}
.pc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:9px 12px;transition:transform .15s,border-color .15s}
.pc .dot{width:16px;height:16px;border-radius:50%;flex:none}
.pc .t{flex:1;font-weight:600;font-size:.95rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc b{font-size:1.5rem}
.pc.act{border-color:var(--c);transform:scale(1.03);box-shadow:0 4px 0 var(--c)}
.board{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:6px}
canvas{display:block;width:100%;touch-action:none;cursor:pointer}
#status,#tstatus,#pzMsg{text-align:center;font-weight:600;font-size:1.05rem;color:var(--ink);margin:10px 0;min-height:1.5em;display:flex;justify-content:center;align-items:center;gap:8px}
#cd{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,236,179,.88);z-index:5}
#cd span{font-size:min(38vw,190px);font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s ease-out both}
.tools{display:flex;justify-content:flex-end;gap:8px}
.tb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.tb.off{color:#b8a37a;background:#f6ecd0}
#cf,#cf2{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9}
#cf2{z-index:10;filter:blur(3px)}
.board{position:relative}
#strike{position:absolute;left:0;top:0;pointer-events:none}
#win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,236,179,.88);z-index:7;padding:16px}
.wc{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:360px;text-align:center;animation:pop2 .5s ease-out}
#wbadge{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:3.2rem;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#wbadge svg{width:46px;height:46px}
#wt{font-size:1.5rem;font-weight:700;margin:4px 0 14px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:2px dashed var(--line);color:var(--ink);font-weight:600}
.rk .t{flex:1;text-align:left}.rk .dot{width:14px;height:14px;border-radius:50%}
.rn{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.85rem}
.wb{display:flex;gap:8px;margin-top:14px}.wb .btn{font-size:1rem;padding:12px}
.gcard+.gcard{margin-top:10px}
#pzMsg{min-height:40px;display:flex;justify-content:center;align-items:center;font-weight:600;font-size:1.05rem;color:var(--ink);margin:10px 0}
.mm{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 16px;animation:mpop .4s cubic-bezier(.3,1.7,.5,1);transition:opacity .4s}
.mm.out{opacity:0}
@keyframes mpop{from{opacity:0;scale:.6;translate:0 8px}}
@keyframes st{from{scale:0;rotate:-90deg}}
.pzpv{width:min(100%,30vh);aspect-ratio:1;margin:0 auto 10px;border-radius:20px;overflow:hidden;background:var(--line)}
.pzpv img{width:100%;height:100%;display:block;object-fit:cover}
.pzstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pzth{aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid transparent;display:grid;place-items:center;background:#fff;color:var(--muted);padding:0;cursor:pointer;position:relative}
.pzth img{width:100%;height:100%;object-fit:cover;display:block}
.pzth.x{border:2px dashed #d8cdb8}
.pzth.on{border-color:#ff7a00}
.pzth.x.on{color:#ff7a00;border:2px solid #ff7a00}
.pzchip{flex:1;display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 4px}
.pzchip small{display:flex;align-items:center;gap:4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pzchip small svg{color:#ff7a00}
.pzchip b{font-size:1.4rem;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.pzcard{padding:8px;display:flex;justify-content:center}
#pplay{display:flex;flex-direction:column;gap:12px;margin:0 auto}
#pplay .pcards{margin:0}
#pplay #pzMsg{margin:0;min-height:36px}
#pzBoard{position:relative;flex:none;background:var(--line);border-radius:16px;overflow:hidden}
.pzbot{display:flex;gap:10px;align-items:stretch}
.pzref{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px;text-align:left;cursor:zoom-in;font:inherit;color:var(--ink)}
.pzref img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none}
.pzref b{display:block;font-size:1rem}.pzref small{color:var(--muted);font-size:.8rem}
.pzbot .ghost{flex:0 0 92px;width:auto;margin:0;flex-direction:column;gap:4px;padding:8px}
.tile{position:absolute;left:0;top:0;background-image:var(--img);background-repeat:no-repeat;transition:transform .22s cubic-bezier(.3,1.3,.5,1);user-select:none;-webkit-user-select:none;box-shadow:inset var(--l,1.5px) 0 0 #ffffffcc,inset calc(var(--r,1.5px)*-1) 0 0 #ffffffcc,inset 0 var(--t,1.5px) 0 #ffffffcc,inset 0 calc(var(--b,1.5px)*-1) 0 #ffffffcc;animation:tpop .45s backwards}
@keyframes tpop{from{opacity:0;scale:.5}}
@keyframes snap{50%{scale:1.05;filter:brightness(1.15)}}
.tile.blank{opacity:0;pointer-events:none}
.tile.drag{transition:none;z-index:5;filter:brightness(1.06) saturate(1.1);cursor:grabbing}
.tile.over{filter:brightness(1.18)}
.tile.snap{animation:snap .4s}
#pzRef{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(59,35,0,.55);cursor:zoom-out}
#pzRef img{width:min(88vw,60vh,520px);aspect-ratio:1;object-fit:cover;border-radius:22px;border:4px solid #fff}

.top{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;align-items:center;margin:0 0 14px}
.top h1{margin:0;font-size:1.2rem;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.ghost{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:12px;margin-top:8px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.gcard .gi svg.s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.cell{aspect-ratio:1;border:2px solid var(--line);background:#fff;border-radius:16px;display:grid;place-items:center;cursor:pointer;padding:0}
.cell:disabled{cursor:default}
.cell.w{background:#fff1c2;border-color:#ff9a00}
.cell svg{width:68%;height:68%;fill:none;stroke-width:5;stroke-linecap:round;animation:pop2 .25s ease-out}
@keyframes pop2{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
/* ===== Word Bingo (all selectors prefixed bn-) ===== */
.bn-w{--n:5;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;width:100%;max-width:calc(var(--n)*66px);margin:0 auto 12px;container-type:inline-size}
.bn-l{position:relative;aspect-ratio:4/5;display:grid;place-items:center;background:#fff;border:2px solid var(--c,var(--ink));border-radius:10px;color:var(--ink);font-weight:700;font-size:1.6rem;font-size:calc(100cqw/var(--n)*.5);line-height:1}
.bn-l.x{background:#f6ecd0;border-color:var(--line);color:#b8a37a}
.bn-l svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#d85f00;stroke-width:3;stroke-linecap:round;animation:pop2 .25s ease-out}
.bn-l svg path{vector-effect:non-scaling-stroke}
.bn-g{--n:5;--gap:6px;--rad:12px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--gap);padding:var(--gap);container-type:inline-size}
.bn-c{aspect-ratio:1;display:grid;place-items:center;min-width:0;padding:0;background:#fff;border:2px solid var(--line);border-radius:var(--rad);color:var(--ink);font:inherit;font-weight:700;font-size:15px;font-size:calc(100cqw/var(--n)*.4);line-height:1;cursor:default}
button.bn-c{cursor:pointer}
.bn-c.e{border-style:dashed;background:transparent}
.bn-c.m{background:#fff1c2;border-color:#ff9a00}
.bn-g.act .bn-c:not(.m){cursor:pointer}
.bn-c.f{animation:bnf .7s ease-out}
@keyframes bnf{0%{background:#ffc400}100%{background:#fff1c2}}
.bn-board{padding:2px;transition:border-color .15s}
.bn-wrap{position:relative}
.bn-wrap.pl{touch-action:none}
.bn-ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bn-note{text-align:center;color:var(--muted);font-weight:600;font-size:.9rem;margin:10px 0;min-height:1.3em}
.bn-err{color:#e11d48}
.bn-row{display:flex;gap:8px;align-items:stretch}
.bn-row .ghost{margin-top:0}
.bn-in{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;font:inherit;font-weight:600;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);-webkit-user-select:text;user-select:text}
.bn-in:focus{outline:none;border-color:#ff9a00}
.bn-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 10px}
.bn-chip{width:100%;min-height:46px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:0 4px;font:inherit;font-weight:600;font-size:clamp(.78rem,3.7vw,.98rem);cursor:pointer;display:grid;place-items:center}
.bn-chip.on{background:var(--grad);color:#fff;border-color:#e86a00;box-shadow:0 3px 0 #d85f00}
.bn-ttl{text-align:center;font-size:1.6rem;font-weight:700;letter-spacing:.12em;color:var(--ink);margin:2px 0 12px}
.bn-ph{margin:14px 0 6px}
.bn-ph:first-of-type{margin-top:0}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.bn-win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,236,179,.88);z-index:7;padding:16px;overflow:auto}
.bn-badge{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.bn-badge svg{width:46px;height:46px}
.bn-wt{font-size:1.5rem;font-weight:700;margin:4px 0 2px}
.bn-sub{color:var(--muted);font-weight:700;letter-spacing:.08em;margin:0 0 14px}
.bn-end{margin-top:0}
.bn-stat{text-align:center;font-weight:600;font-size:1.05rem;color:var(--ink);margin:10px 0 0;min-height:1.5em;display:flex;justify-content:center;align-items:center;gap:8px}
#bnMsg{min-height:40px;display:flex;justify-content:center;align-items:center;font-weight:600;font-size:.95rem;color:var(--muted);margin:4px 0 6px;text-align:center}
#bnPcs .pc{padding:8px 10px;gap:8px}
#bnPcs .pc .t{font-size:.9rem;overflow:visible;text-overflow:clip}
#bnPcs .pc b{font-size:1.15rem}
.bn-in::placeholder{text-transform:none;letter-spacing:0;font-weight:500;color:#b8a37a}
.bn-tools{margin-top:12px}
#bnArr .bn-w,#bnReady .bn-w{max-width:calc(var(--n)*44px);margin-bottom:8px}
.bn-bar{display:flex;gap:6px;align-items:stretch;margin:0 0 8px}
.bn-bar .seg{flex:1 1 auto;gap:6px;flex-wrap:nowrap;min-width:0}
.bn-bar .seg button{min-width:0;padding:8px 0;font-size:.85rem;border-radius:12px;box-shadow:none}
.bn-bar .seg button.on{box-shadow:0 2px 0 #d85f00}
.bn-tl{display:flex;gap:6px;flex:none}
.bn-ic{display:flex;align-items:center;justify-content:center;gap:4px;min-width:38px;padding:0 10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
.bn-ic svg.i{width:16px;height:16px}
#bnArr .bn-board,#bnReady .bn-board{width:100%;max-width:max(250px,calc(100vh - 350px));max-width:max(250px,calc(100svh - 350px));margin:0 auto}
#bnArr .bn-note{margin:6px 0;min-height:1.2em}
#bnArr .cta,#bnReady .cta{margin-top:12px}
button.pc{font:inherit;color:var(--ink);text-align:left;cursor:pointer}
button.pc:disabled{cursor:default}
.pc.dim{opacity:.5}
#bnPcs .pc,#bnPcs .pc.act{transform:none;box-shadow:none}
#bnPcs .pc.act{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
<symbol id="redo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></symbol>
<symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
<symbol id="music-off" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="m2 2 20 20"/></symbol>
<symbol id="volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></symbol>
<symbol id="volume-off" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
<symbol id="mx" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
<symbol id="mo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
<symbol id="grid3" viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M3 8h18M3 16h18"/></symbol>
<symbol id="slide" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
<symbol id="puzzle" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="wbingo" viewBox="0 0 24 24"><rect x="2.5" y="4" width="8" height="10" rx="2"/><rect x="13.5" y="4" width="8" height="10" rx="2"/><path d="M4.5 7.5l4 3M15.5 7.5l4 3M3 19h18"/></symbol>
<symbol id="trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1.1 1.2C7.8 18.7 7 20.2 7 22M14 14.7V17c0 .6.5 1 1.1 1.2 1.1.5 1.9 2 1.9 3.8M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>

<script>
const COLORS=['#2563eb','#e11d48','#16a34a','#7c3aed','#0d9488','#92400e'];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let np=2,nd=5,pick=[0,1,2];
let n,H,V,B,turn,sc,over,hover,W=0,P=[],busy=false,timer=null;
const ic=id=>`<svg class="i"><use href="#${id}"/></svg>`;
function seg(el,vals,cur,fn){
  el.innerHTML='';
  vals.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.className=v===cur?'on':'';b.onclick=()=>fn(v);el.appendChild(b);});
}
function names(){return np===1?['You','Computer']:Array.from({length:np},(_,i)=>'Player '+(i+1));}
function renderSetup(){
  seg($('segP'),[1,2,3],np,v=>{np=v;renderSetup();});
  seg($('segD'),[3,4,5,6,7,8],nd,v=>{nd=v;renderSetup();});
  const rows=$('rows');rows.innerHTML='';
  const cnt=np===1?2:np;
  names().forEach((name,i)=>{
    const r=document.createElement('div');r.className='prow';
    r.innerHTML=`<div class="nm">${ic(np===1&&i===1?'cpu':'user')}${name}</div>`;
    const sw=document.createElement('div');sw.className='sw';
    COLORS.forEach((c,ci)=>{
      const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Colour '+(ci+1));
      const taken=pick.slice(0,cnt).some((p,j)=>j!==i&&p===ci);
      if(pick[i]===ci){b.className='on';b.innerHTML=ic('check');}else if(taken)b.className='taken';
      b.onclick=()=>{if(taken)return;pick[i]=ci;renderSetup();};
      sw.appendChild(b);
    });
    r.appendChild(sw);rows.appendChild(r);
  });
}
let AC=null,mg,sg,musicOn=true,soundOn=true,mt=null,ms=0;
function initAudio(){
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);sg=AC.createGain();sg.gain.value=.8;sg.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  startMusic();
}
function note(f,d,type,v,t,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
function tone(f,d,type='sine',v=.25,delay=0){if(AC&&soundOn)note(f,d,type,v,AC.currentTime+delay,sg);}
const MEL=[523.25,659.25,783.99,659.25,880,783.99,659.25,587.33,523.25,659.25,783.99,880,783.99,659.25,587.33,0];
const BAS=[130.81,110,87.31,98];
function startMusic(){
  if(!AC||!musicOn||mt)return;
  mt=setInterval(()=>{
    const t=AC.currentTime+.02,i=ms%16;
    if(MEL[i])note(MEL[i],.22,'triangle',.18,t,mg);
    if(i%4===0)note(BAS[i/4],.9,'sine',.22,t,mg);
    ms++;
  },240);
}
function stopMusic(){clearInterval(mt);mt=null;}
function sfx(got){
  if(over){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.3,i*.12));return;}
  if(got){tone(784,.18,'sine',.3);tone(1047,.3,'sine',.3,.1);}
  else tone(440,.08,'triangle',.25);
}
$('bm').onclick=()=>{initAudio();musicOn=!musicOn;musicOn?startMusic():stopMusic();$('mu').setAttribute('href',musicOn?'#music':'#music-off');$('bm').classList.toggle('off',!musicOn);};
$('bs').onclick=()=>{initAudio();soundOn=!soundOn;$('su').setAttribute('href',soundOn?'#volume':'#volume-off');$('bs').classList.toggle('off',!soundOn);};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume();});
const cf=$('cf'),cx=cf.getContext('2d'),cf2=$('cf2'),cx2=cf2.getContext('2d');let parts=[],raf=0,confT=[];
function sizeC(){const d=Math.min(devicePixelRatio||1,2);[cf,cf2].forEach(c=>{c.width=innerWidth*d;c.height=innerHeight*d;});[cx,cx2].forEach(x=>x.setTransform(d,0,0,d,0,0));}
function loop(){
  const W=innerWidth,H=innerHeight;cx.clearRect(0,0,W,H);cx2.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.t<p.life&&p.y<H+60);
  for(const p of parts){
    if(++p.t<0)continue;
    p.vx*=.965;p.vy=Math.min(p.vy*.965+.2,p.term);
    p.ph+=p.fs;p.x+=p.vx+Math.sin(p.ph*.45+p.sw)*p.sa;p.y+=p.vy;
    const f=Math.cos(p.ph),c=p.near?cx2:cx,shape=col=>{const w=p.w,h=p.h;c.fillStyle=col;c.strokeStyle=col;c.beginPath();
      switch(p.k){
        case 0:c.rect(-w/2,-h/2,w,h);c.fill();break;
        case 1:c.lineWidth=Math.max(2,w*.7);c.lineCap='round';c.moveTo(-h/2,0);c.bezierCurveTo(-h/6,-h*.35,h/6,h*.35,h/2,0);c.stroke();break;
        case 2:c.arc(0,0,w/2,0,7);c.fill();break;
        case 3:c.moveTo(0,-h/2);c.lineTo(w/2,h/2);c.lineTo(-w/2,h/2);c.closePath();c.fill();break;
        case 4:for(let i=0;i<10;i++){const r=i%2?w*.22:w*.5,a=i*Math.PI/5-Math.PI/2;c[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();break;
        case 5:c.moveTo(0,-h/2);c.lineTo(w/2,0);c.lineTo(0,h/2);c.lineTo(-w/2,0);c.closePath();c.fill();break;
        case 6:c.arc(0,0,w/2,0,Math.PI);c.closePath();c.fill();break;
        default:c.moveTo(-w/2,-h/2);c.lineTo(w/2,-h*.3);c.lineTo(w*.35,h/2);c.lineTo(-w*.4,h*.4);c.closePath();c.fill();
      }};
    c.save();c.globalAlpha=Math.min(1,(p.life-p.t)/45);c.translate(p.x,p.y);c.rotate(p.rot+p.t*p.vr);c.scale(1,f);
    shape(p.c);
    if(f<0)shape('rgba(0,0,0,.2)');
    c.restore();
  }
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf){cx.clearRect(0,0,W,H);cx2.clearRect(0,0,W,H);}
}
function burst(){
  sizeC();
  const cols=['#ffc400','#ff7a00','#e11d48','#2563eb','#16a34a','#7c3aed','#f472b6','#ffffff'],m=Math.min(1,innerWidth/520)*.45+.65;
  for(const side of [0,1])for(let i=0;i<90;i++){
    const a=(side?-Math.PI*.64:-Math.PI*.36)+(Math.random()-.5)*.6,s=(12+Math.random()*13)*m,near=Math.random()<.18,r=Math.random(),sc=(near?1.9:1)*m,k=(r*8)|0;
    parts.push({x:side?innerWidth-10:10,y:innerHeight-10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,k,near,
      w:(k===1?2.5+Math.random()*2.5:k===4?9+Math.random()*6:k===2?4+Math.random()*5:6+Math.random()*7)*sc,h:(k===1?16+Math.random()*16:5+Math.random()*9)*sc,
      c:cols[(Math.random()*cols.length)|0],rot:Math.random()*6.3,vr:(Math.random()-.5)*.08,ph:Math.random()*6.3,fs:.1+Math.random()*.22,
      sw:Math.random()*6.3,sa:.2+Math.random()*.8,term:1.5+Math.random()*1.8,life:240+Math.random()*120,t:-Math.random()*6});
  }
  if(!raf)raf=requestAnimationFrame(loop);
  tone(300,.25,'sawtooth',.12);tone(900,.15,'square',.08,.05);
}
function stopConf(){confT.forEach(clearTimeout);confT=[];parts=[];cancelAnimationFrame(raf);raf=0;cx.clearRect(0,0,cf.width,cf.height);cx2.clearRect(0,0,cf2.width,cf2.height);}
function strike(L){
  const bd=$('b3').parentElement,br=bd.getBoundingClientRect(),ox=br.left+bd.clientLeft,oy=br.top+bd.clientTop;
  const c=i=>{const r=cells[i].getBoundingClientRect();return[r.left-ox+r.width/2,r.top-oy+r.height/2,r.width];};
  let[x1,y1,w]=c(L[0]),[x2,y2]=c(L[2]);
  const len=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/len,uy=(y2-y1)/len,e=w*.32;
  x1-=ux*e;y1-=uy*e;x2+=ux*e;y2+=uy*e;
  const d=Math.hypot(x2-x1,y2-y1),s=$('strike');
  s.setAttribute('width',bd.clientWidth);s.setAttribute('height',bd.clientHeight);
  s.innerHTML=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${tP[tt].color}" stroke-width="${Math.max(10,w*.15)}" stroke-linecap="round" style="stroke-dasharray:${d};stroke-dashoffset:${d};transition:stroke-dashoffset .45s ease-out"/>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.firstChild.style.strokeDashoffset=0;}));
}
function showWin(w){
  const rk=P.map((p,i)=>({p,s:sc[i]})).sort((a,b)=>b.s-a.s),tie=w.length>1,wi=P.indexOf(w[0]);
  $('wbadge').style.background=tie?'':P[wi].color;
  $('wbadge').style.backgroundImage=tie?'linear-gradient(135deg,#ffc400,#ff7a00)':'none';
  $('wbadge').innerHTML=tie?'=':wi+1;
  $('wt').textContent=tie?'Draw':'Winner '+(wi+1);
  $('rks').innerHTML=rk.map(r=>`<div class="rk"><span class="rn">${rk.findIndex(x=>x.s===r.s)+1}</span><span class="dot" style="background:${r.p.color}"></span><span class="t">${r.p.name}</span><b>${r.s}</b></div>`).join('');
  confT.push(setTimeout(()=>{$('win').hidden=false;if(!tie)burst();},cur==='ttt'?1100:700));
}
function start(){
  clearInterval(timer);
  P=names().map((name,i)=>({name,color:COLORS[pick[i]],ai:np===1&&i===1}));
  n=nd;H=Array.from({length:n},()=>Array(n-1).fill(0));V=Array.from({length:n-1},()=>Array(n).fill(0));
  B=Array.from({length:n-1},()=>Array(n-1).fill(0));
  turn=0;sc=P.map(()=>0);over=false;hover=null;busy=true;
  $('setup').hidden=true;$('game').hidden=false;$('win').hidden=true;stopConf();cur='dots';
  const card=(p,i)=>`<div class="pc" id="pc${i}" style="--c:${p.color}"><span class="dot" style="background:${p.color}"></span><span class="t">${p.name}</span><b id="sc${i}">0</b></div>`;
  $('top').innerHTML=card(P[0],0);
  $('bot').innerHTML=P.slice(1).map((p,i)=>card(p,i+1)).join('');
  resize();ui();$('status').textContent='Get ready…';
  let k=3;const cd=$('cd'),num=$('cdn');
  const show=()=>{tone(k===3?523:k===2?659:784,.15,'triangle',.3);num.textContent=k;num.style.animation='none';num.offsetWidth;num.style.animation='';};
  cd.hidden=false;show();
  timer=setInterval(()=>{
    k--;
    if(k>0){show();return;}
    clearInterval(timer);cd.hidden=true;busy=false;ui();maybeAI();
  },800);
}
function resize(){
  if($('game').hidden)return;
  W=Math.min(cv.parentElement.clientWidth-12,520);
  const d=devicePixelRatio||1;cv.width=W*d;cv.height=W*d;cv.style.height=W+'px';
  ctx.setTransform(d,0,0,d,0,0);draw();
}
const M=()=>Math.max(18,W*.05),cell=()=>(W-2*M())/(n-1),pt=(r,c)=>[M()+c*cell(),M()+r*cell()];
function draw(){
  if(!P.length)return;
  const cs=cell(),line='#ecd08f',ink='#7a4300';
  ctx.clearRect(0,0,W,W);
  ctx.globalAlpha=.22;
  for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++)if(B[r][c]){ctx.fillStyle=P[B[r][c]-1].color;const[x,y]=pt(r,c);ctx.fillRect(x+2,y+2,cs-4,cs-4);}
  ctx.globalAlpha=1;ctx.lineCap='round';
  ctx.font='700 '+Math.max(14,cs*.45)+'px Fredoka,ui-rounded,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++)if(B[r][c]){ctx.fillStyle=P[B[r][c]-1].color;const[x,y]=pt(r,c);ctx.fillText(B[r][c],x+cs/2,y+cs/2+1);}
  const sg=(a,b,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();};
  const lw=Math.max(5,cs*.1);
  for(let r=0;r<n;r++)for(let c=0;c<n-1;c++)H[r][c]?sg(pt(r,c),pt(r,c+1),P[H[r][c]-1].color,lw):sg(pt(r,c),pt(r,c+1),line,2);
  for(let r=0;r<n-1;r++)for(let c=0;c<n;c++)V[r][c]?sg(pt(r,c),pt(r+1,c),P[V[r][c]-1].color,lw):sg(pt(r,c),pt(r+1,c),line,2);
  if(hover&&!over&&!busy){ctx.globalAlpha=.5;const[t,r,c]=hover,col=P[turn].color;t==='h'?sg(pt(r,c),pt(r,c+1),col,lw):sg(pt(r,c),pt(r+1,c),col,lw);ctx.globalAlpha=1;}
  ctx.fillStyle=ink;const dr=Math.max(4,cs*.08);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const[x,y]=pt(r,c);ctx.beginPath();ctx.arc(x,y,dr,0,7);ctx.fill();}
}
function nearest(e){
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*W/b.width;
  let best=null,bd=cell()*.4;
  const dist=(a,b2)=>{const[ax,ay]=a,[bx,by]=b2,dx=bx-ax,dy=by-ay;let t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(x-ax-t*dx,y-ay-t*dy);};
  for(let r=0;r<n;r++)for(let c=0;c<n-1;c++)if(!H[r][c]){const d=dist(pt(r,c),pt(r,c+1));if(d<bd){bd=d;best=['h',r,c];}}
  for(let r=0;r<n-1;r++)for(let c=0;c<n;c++)if(!V[r][c]){const d=dist(pt(r,c),pt(r+1,c));if(d<bd){bd=d;best=['v',r,c];}}

 while(q.length){const i=q.pop(),nb=[];if(i%n<n-1&&L.has('h'+a[i]))nb.push(i+1);if(i%n>0&&L.has('h'+a[i-1]))nb.push(i-1);if(L.has('v'+a[i]))nb.push(i+n);if(i>=n&&L.has('v'+a[i-n]))nb.push(i-n);
  nb.forEach(j=>{if(!seen.has(j)){seen.add(j);q.push(j)}})}

function tryMove(f,t,one){

  const r=b/n|0,c=b%n,nb=[];if(r>0)nb.push(b-n);if(r<n-1)nb.push(b+n);if(c>0)nb.push(b-1);if(c<n-1)nb.push(b+1);

function dragStart(ev,id){

  const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;

  if(res){hov=res.D.map(d=>tiles[cells[d]]);hov.forEach(h=>h.classList.add('over'))}

  if(res){begin();const pb=placed();cells=res.a;moves++;place();hud();
   if(res.gain>0)grp(cells,cells.indexOf(id)).forEach(i=>{const t=tiles[cells[i]];t.classList.remove('snap');void t.offsetWidth;t.classList.add('snap')});
   if(solved())win();else react(pb,res.gain,res.cut,false)}
  else{place();react(0,0,0,true)}

/* ===================== WORD BINGO ===================== */
(()=>{
/* ---------- 1. Vocabulary (by number of letters, 3-8) ---------- */
const LEN={
3:'WIN FUN JOY CAT DOG SUN HAT PEN BOX RED SKY MAP CUP BAG TOY',
4:'GAME LOVE BALL CAKE FISH MILK TREE DUCK BIRD FROG MOON STAR BOOK PLAY JUMP KIND',
5:'BINGO HAPPY APPLE GREEN SMILE HOUSE TIGER WATER LIGHT BRAVE DREAM PEACE MUSIC EARTH OCEAN',
6:'FRIEND WINNER SCHOOL GARDEN MONKEY FLOWER PLANET BASKET ORANGE WINTER SUMMER CASTLE FOREST FAMILY',
7:'VICTORY SUCCESS COURAGE EXPLORE HARVEST FREEDOM KITCHEN MORNING DOLPHIN CAPTAIN RAINBOW WEATHER JOURNEY',
8:'CHAMPION GAMEPLAY DISCOVER ELOQUENT GENEROUS DILIGENT PATIENCE STRATEGY FLEXIBLE MOMENTUM ADEQUATE ABUNDANT'
};
const LENS=[3,4,5,6,7,8];
const MINL=3,MAXL=8;
const okWord=w=>typeof w==='string'&&w.length>=MINL&&w.length<=MAXL&&/^[A-Z]+$/.test(w);
const wordsFor=l=>(LEN[l]||'').split(' ').filter(okWord);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const newSix=(l,not)=>shuf(wordsFor(l).filter(w=>w!==not)).slice(0,6);

/* ---------- 2. Grid generation & number arrangement ---------- */
const serialGrid=n=>Array.from({length:n*n},(_,i)=>i+1);
const randomGrid=n=>{const a=serialGrid(n);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const emptyGrid=n=>Array(n*n).fill(0);
const isComplete=(a,n)=>a.length===n*n&&new Set(a).size===n*n&&a.every(v=>Number.isInteger(v)&&v>=1&&v<=n*n);

/* ---------- 3. Lines & swipe validation ---------- */
const lineKeys=n=>{const k=[];for(let i=0;i<n;i++)k.push('r'+i);for(let i=0;i<n;i++)k.push('c'+i);k.push('d','a');return k};
function lineCells(key,n){
  const t=key[0],i=+key.slice(1),o=[];
  for(let j=0;j<n;j++)o.push(t==='r'?i*n+j:t==='c'?j*n+i:t==='d'?j*n+j:j*n+(n-1-j));
  return o;
}
/* From start/end cell coordinates decide which full-length line (if any) was swiped */
function classify(n,sr,sc,er,ec){
  const L=n-1,dr=er-sr,dc=ec-sc;
  if(!dr&&!dc)return{err:'Swipe across the whole line'};
  if(!dr)return (sc===0&&ec===L)||(sc===L&&ec===0)?{key:'r'+sr}:{err:'Swipe from one end of the row to the other'};
  if(!dc)return (sr===0&&er===L)||(sr===L&&er===0)?{key:'c'+sc}:{err:'Swipe from one end of the column to the other'};
  if(Math.abs(dr)===Math.abs(dc))return Math.abs(dr)===L?{key:sr===sc?'d':'a'}:{err:'Swipe from corner to corner'};
  return{err:'Lines must be straight: across, down or diagonal'};
}
/* Every sampled pointer position must stay close to the straight segment a->b */
function straightPts(pts,a,b,tol){
  const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;if(!len2)return false;const len=Math.sqrt(len2);
  return pts.every(p=>{const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2,d=Math.abs((p.x-a.x)*dy-(p.y-a.y)*dx)/len;return d<=tol&&t>=-.5&&t<=1.5});
}
const lineComplete=(marks,key,n)=>lineCells(key,n).every(i=>marks[i]);
/* Final judgement of a swipe: returns {key} or {err} */
function judge(n,marks,drawn,sr,sc,er,ec,straightOK){
  const c=classify(n,sr,sc,er,ec);if(c.err)return c;
  if(!straightOK)return{err:'Keep your swipe in a straight line'};
  if(drawn.includes(c.key))return{err:'That line is already counted'};
  const miss=lineCells(c.key,n).filter(i=>!marks[i]).length;
  if(miss)return{err:miss+(miss>1?' numbers':' number')+' on that line not called yet'};
  return{key:c.key};
}

/* ---------- 4. State ---------- */
const PN=['You','Other'];

function geom(){

  return{wrap,cx,cy,W:wrap.clientWidth,H:wrap.clientHeight,stride:n>1?cx[1]-cx[0]:cs[0].offsetWidth,cw:cs[0].offsetWidth};
}
const ctr=(g,i)=>({x:g.cx[i%n],y:g.cy[i/n|0]});

function callNum(i){
  if(over||busy)return;
  if(turn<0){tone(220,.1,'sawtooth',.1);say('Choose who starts first');return}
  const who=turn,num=arr[0][i];
  if(marks[i]){tone(220,.1,'sawtooth',.1);say(`${num} was already called`);return}
  called.add(num);calledNow=true;lastCalled=num;marks[i]=true;
  tone(660,.12,'triangle',.28);tone(880,.16,'sine',.2,.08);
  renderPlay(num);say(`${PN[who]} called ${num}`);
  if(called.size<n*n){busy=true;g_off();pt=setTimeout(nextTurn,600)}
}
const g_off=()=>$('bnPlG').classList.remove('act');
function nextTurn(){
  if(over)return;
  busy=false;turn=1-turn;calledNow=false;held=false;renderPlay(lastCalled);
  if(called.size===n*n)say('All numbers called — swipe your remaining lines');else hint();
}
/* choose who starts (changeable until the first number is called) */
$('bnPcs').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b||over||counting||called.size)return;
  turn=+b.dataset.t;tone(660,.08,'triangle',.2);renderPlay();hint();
});

/* ----- manual line drawing ----- */
const rel=e=>{const r=$('bnPlWrap').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const canAct=()=>inGame&&!over&&!busy&&marks;
function preview(a,b,bad){
  const ov=$('bnOv');let l=ov.querySelector('#bnPrev');
  if(!a){if(l)l.remove();return}
  if(!l){ov.insertAdjacentHTML('beforeend','<line id="bnPrev" stroke-linecap="round"/>');l=ov.querySelector('#bnPrev')}
  const w=Math.max(4,(curG?curG.cw:30)*.13);
  l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);
  l.setAttribute('stroke',bad?'#e11d48':COLORS[0]);l.setAttribute('stroke-opacity',bad?.8:.45);l.setAttribute('stroke-width',w);
}
const wrapEl=$('bnPlWrap');
wrapEl.addEventListener('pointerdown',e=>{
  if(!canAct())return;e.preventDefault();
  const g=geom();if(!g)return;curG=g;const pos=rel(e);
  ptr={id:e.pointerId,g,start:cellAt(g,pos),pts:[pos],drag:false,x0:pos.x,y0:pos.y};
  try{wrapEl.setPointerCapture(e.pointerId)}catch(x){}
});
wrapEl.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;const pos=rel(e);ptr.pts.push(pos);
  if(!ptr.drag&&Math.hypot(pos.x-ptr.x0,pos.y-ptr.y0)<Math.max(10,ptr.g.stride*.3))return;
  ptr.drag=true;const s=ctr(ptr.g,ptr.start),en=cellAt(ptr.g,pos),sr=ptr.start/n|0,sc=ptr.start%n,er=en/n|0,ec=en%n;
  const dr=er-sr,dc=ec-sc,aligned=(!dr||!dc||Math.abs(dr)===Math.abs(dc))&&(dr||dc);
  preview(s,aligned?ctr(ptr.g,en):pos,!aligned);
});
wrapEl.addEventListener('pointerup',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;const P=ptr;ptr=null;
  try{wrapEl.releasePointerCapture(e.pointerId)}catch(x){}
  const pos=rel(e);P.pts.push(pos);
  if(!P.drag){preview(null);callNum(P.start);return}
  const en=cellAt(P.g,pos),sr=P.start/n|0,sc=P.start%n,er=en/n|0,ec=en%n;
  const a=ctr(P.g,P.start),b=ctr(P.g,en);
  const res=judge(n,marks,drawn,sr,sc,er,ec,straightPts(P.pts,a,b,P.g.stride*.62));
  if(res.err){
    preview(a,b,true);tone(220,.12,'sawtooth',.12);tone(170,.16,'sawtooth',.1,.08);say(res.err);
    pt=setTimeout(()=>preview(null),450);return;
  }
  preview(null);addLine(res.key);
});
wrapEl.addEventListener('pointercancel',()=>{ptr=null;preview(null)});

function addLine(key){
  drawn.push(key);kk++;
  [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.28,i*.07));
  if(kk>=n){return win()}
  renderPlay();say(`${word[kk-1]} eliminated!`);
}

/* ----- victory ----- */
function duck(on){try{if(mg)mg.gain.value=on?.12:.5}catch(e){}}
let unlocked=false;
function unlockSpeech(){
  if(unlocked)return;unlocked=true;
  try{if('speechSynthesis' in window){speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
}
function announce(){
  if(announced)return;announced=true;                       // once per completed game
  if(!soundOn||!('speechSynthesis' in window))return;
  try{
    const sy=speechSynthesis;if(sy.speaking||sy.pending)sy.cancel();
    const vs=sy.getVoices(),v=vs.find(x=>/en[-_](US|IN|GB)/i.test(x.lang)&&/natural|google|samantha|female/i.test(x.name))||vs.find(x=>/^en/i.test(x.lang));
    duck(true);
    const say1=(t,rate,pitch,last)=>{const u=new SpeechSynthesisUtterance(t);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=rate;u.pitch=pitch;u.volume=1;if(last)u.onend=u.onerror=()=>duck(false);sy.speak(u)};
    say1([...word].join(', '),.75,1,false);                  // spell the target word
    for(let i=0;i<3;i++)say1('Bingo!',.92,1.15,i===2);       // then BINGO exactly three times
    setTimeout(()=>duck(false),6000);
  }catch(e){duck(false)}
}
function win(){
  over=true;busy=true;winner=0;ptr=null;preview(null);
  renderPlay();say('');$('bnMsg').textContent='';
  [523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.3,i*.12));
  announce();
  $('bnWin').innerHTML=`<div class="wc"><div class="bn-badge" style="background:${COLORS[0]}">${ic('trophy')}</div>
    <div class="bn-wt">You win!</div><div class="bn-sub">BINGO! BINGO! BINGO!</div>
    <div class="bn-w" id="bnWinW"></div>
    <div class="wb"><button class="btn" id="bnReplay">Replay</button><button class="btn" id="bnNew">New game</button></div></div>`;
  setWord($('bnWinW'),word,n,COLORS[0]);
  $('bnReplay').onclick=()=>{initAudio();startGame(true)};
  $('bnNew').onclick=()=>{leave();show('bnSetup');renderSetup()};
  confT.push(setTimeout(()=>{$('bnWin').hidden=false;burst()},700));
}
function leave(){stopAll();inGame=false;busy=false}
$('bnAgain').onclick=()=>{initAudio();startGame(true)};

/* ---------- 10. Navigation ---------- */
$('g5').onclick=()=>{inGame=false;renderSetup();show('bnSetup')};
$('bnHome').onclick=()=>{$('bnSetup').hidden=true;$('hub').hidden=false};
$('bnBackArr').onclick=()=>{show('bnSetup');renderSetup()};
$('bnBackRdy').onclick=()=>startArr(rp);
$('bnMenu').onclick=()=>{leave();show('bnSetup');renderSetup()};
$('bnNext').onclick=()=>{initAudio();unlockSpeech();startArr(0,true)};

/* test hooks (pure logic only) */
window.WB={LEN,wordsFor,okWord,serialGrid,randomGrid,isComplete,lineKeys,lineCells,classify,straightPts,judge,
  get state(){return{n,word,arr,marks,drawn,kk,called:called&&[...called],turn,over,busy,held,announced,winner}}};
})();

const SCR={hub:['Dot Games',''],bnSetup:['Word Bingo','bnHome'],bnArr:['Word Bingo','bnBackArr'],bnReady:['Word Bingo','bnBackRdy'],bnPlay:['Word Bingo','bnMenu'],setup:['Dots & Boxes','home'],game:['Dots & Boxes','menu'],tsetup:['Tic Tac Toe','thome'],tgame:['Tic Tac Toe','tmenu'],psetup:['','phome'],pplay:['','pmenu']};
const scr=()=>Object.keys(SCR).find(k=>!$(k).hidden)||'hub';
function sync(){const id=scr();$('ttl').textContent=id[0]==='p'?(PZ.mode==='link'?'Connect Puzzle':'Slide Puzzle'):SCR[id][0];$('gback').style.visibility=SCR[id][1]?'visible':'hidden';}
new MutationObserver(sync).observe($('app'),{subtree:true,attributes:true,attributeFilter:['hidden']});
addEventListener('resize',sync);
$('gback').onclick=()=>{const id=scr();if(SCR[id][1])$(SCR[id][1]).click();};
$('phome').onclick=()=>PZ.home();$('pmenu').onclick=()=>PZ.menu();
$('g3').onclick=()=>PZ.open('slide');$('g4').onclick=()=>PZ.open('link');
renderSetup();renderT();sync();

</script>
